<!DOCTYPE html>
<html lang="it" data-scheme="light" data-md-theme="github">
<head>
  <meta charset="UTF-8">
  <title>w3r</title>
  <link rel="stylesheet" href="/vendor/github-markdown.css">
  <link rel="stylesheet" href="/vendor/github-markdown-themes.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="sidebar">
    <button id="btn-back" class="icon-btn" title="Indietro (Alt+←)" aria-label="Indietro" disabled>
      <span class="icon" style="--icon: url(/icons/arrow_back.svg)"></span>
    </button>
    <button id="btn-forward" class="icon-btn" title="Avanti (Alt+→)" aria-label="Avanti" disabled>
      <span class="icon" style="--icon: url(/icons/arrow_forward.svg)"></span>
    </button>
    <hr>
    <button id="btn-open" class="icon-btn" title="Apri (Ctrl+O)" aria-label="Apri">
      <span class="icon" style="--icon: url(/icons/folder_open.svg)"></span>
    </button>
    <button id="btn-open-column" class="icon-btn" title="Apri in una nuova colonna (Ctrl+Maiusc+O)" aria-label="Apri in una nuova colonna">
      <span class="icon" style="--icon: url(/icons/add_column.svg)"></span>
    </button>
    <button id="btn-edit" class="icon-btn" title="Modifica (Ctrl+E)" aria-label="Modifica" disabled>
      <span class="icon" style="--icon: url(/icons/edit.svg)"></span>
    </button>
    <button id="btn-save" class="icon-btn" title="Salva (Ctrl+S)" aria-label="Salva" disabled>
      <span class="icon" style="--icon: url(/icons/save.svg)"></span>
    </button>
    <button id="btn-discard" class="icon-btn" title="Annulla tutte le modifiche" aria-label="Annulla tutte le modifiche" disabled>
      <span class="icon" style="--icon: url(/icons/undo.svg)"></span>
    </button>
    <button id="btn-insert" class="icon-btn" title="Inserisci" aria-label="Inserisci" aria-haspopup="menu" aria-expanded="false" popovertarget="insert-menu" disabled>
      <span class="icon" style="--icon: url(/icons/add_box.svg)"></span>
    </button>
    <button id="btn-print" class="icon-btn" title="Stampa (Ctrl+P)" aria-label="Stampa" disabled>
      <span class="icon" style="--icon: url(/icons/print.svg)"></span>
    </button>
    <hr>
    <button id="btn-wrap" class="icon-btn" title="A capo automatico (Alt+Z)" aria-label="A capo automatico" aria-pressed="false" disabled>
      <span class="icon" style="--icon: url(/icons/wrap_text.svg)"></span>
    </button>
    <button id="btn-zoom-in" class="icon-btn" title="Aumenta zoom (Ctrl++)" aria-label="Aumenta zoom">
      <span class="icon" style="--icon: url(/icons/zoom_in.svg)"></span>
    </button>
    <button id="btn-zoom-out" class="icon-btn" title="Riduci zoom (Ctrl+-)" aria-label="Riduci zoom">
      <span class="icon" style="--icon: url(/icons/zoom_out.svg)"></span>
    </button>
    <button id="btn-zoom-reset" class="icon-btn" title="Zoom 100% (Ctrl+0)" aria-label="Zoom 100%" disabled>
      <span class="icon" style="--icon: url(/icons/fit_screen.svg)"></span>
    </button>
    <button id="btn-settings" class="icon-btn" title="Impostazioni" aria-label="Impostazioni">
      <span class="icon" style="--icon: url(/icons/settings.svg)"></span>
    </button>
  </nav>
  <div id="insert-menu" class="menu" role="menu" aria-label="Inserisci" popover>
    <button class="menu-item" role="menuitem" data-insert="page-break">
      <span class="icon" style="--icon: url(/icons/page_break.svg)"></span>Salto pagina
    </button>
  </div>
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Impostazioni</h2>
      <label class="setting">
        <span>Tema</span>
        <select id="setting-theme">
          <option value="system">Sistema</option>
          <option value="light">Chiaro</option>
          <option value="dark">Scuro</option>
        </select>
      </label>
      <label class="setting">
        <span>Tema dei documenti</span>
        <select id="setting-md-theme">
          <option value="github">GitHub</option>
          <option value="github-hc">GitHub alto contrasto</option>
          <option value="solarized">Solarized</option>
          <option value="academic">Accademico</option>
        </select>
      </label>
      <label class="setting">
        <span>Zoom dei documenti</span>
        <select id="setting-zoom"></select>
      </label>
      <div class="setting">
        <label for="setting-page-width">Larghezza pagina</label>
        <span class="setting-controls">
          <input type="number" id="setting-page-width-custom" step="10" aria-label="Larghezza personalizzata in pixel" hidden>
          <select id="setting-page-width">
            <option value="narrow">Stretta</option>
            <option value="medium">Media</option>
            <option value="large">Larga</option>
            <option value="custom">Personalizzata</option>
          </select>
        </span>
      </div>
      <label class="setting checkbox">
        <input type="checkbox" id="setting-new-window">
        <span>Apri ogni file da Esplora risorse in una nuova finestra<br>
          <small>Altrimenti il file si aggiunge all'ultima finestra di w3r selezionata</small></span>
      </label>
      <div class="settings-actions"><button class="text-btn">Chiudi</button></div>
    </form>
  </dialog>
  <div id="zoom-badge" aria-live="polite"></div>
  <div id="columns-area">
    <main id="columns"></main>
    <button id="btn-scroll-left" class="scroll-btn" title="Colonna nascosta a sinistra" aria-label="Mostra la colonna a sinistra" hidden>
      <span class="icon" style="--icon: url(/icons/chevron_left.svg)"></span>
    </button>
    <button id="btn-scroll-right" class="scroll-btn" title="Colonna nascosta a destra" aria-label="Mostra la colonna a destra" hidden>
      <span class="icon" style="--icon: url(/icons/chevron_right.svg)"></span>
    </button>
  </div>
  <aside id="file-list" aria-label="File visti" hidden>
    <header class="file-list-header">
      <span id="file-list-count"></span>
      <button id="btn-close-all" class="icon-btn small" title="Chiudi tutti i documenti e svuota l'elenco" aria-label="Chiudi tutti i documenti">
        <span class="icon" style="--icon: url(/icons/playlist_remove.svg)"></span>
      </button>
    </header>
    <ul id="file-list-items"></ul>
  </aside>

  <script src="/js/neutralino.js"></script>
  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
